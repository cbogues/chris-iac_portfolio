name: Terraform Okta Plan

# Plan-only. No auto-apply: CI has no access to the local Terraform state
# file (terraform.tfstate is gitignored on purpose), so an apply job here
# would have no idea what already exists in Okta and would try to recreate
# resources that are already live, exactly what caused the "already exists"
# failure on 2026-07-11. Applies run locally until a remote backend (S3 +
# DynamoDB, stretch goal 1 in PROGRESS.md) gives CI and local the same state
# to work from. Re-add an apply job at that point.

on:
  pull_request:
    paths:
      - "okta/**"
      - ".github/workflows/terraform-okta.yml"

jobs:
  terraform:
    name: Terraform (Okta)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okta
    env:
      TF_VAR_okta_org_name: ${{ secrets.OKTA_ORG_NAME }}
      TF_VAR_okta_base_url: ${{ secrets.OKTA_BASE_URL }}
      TF_VAR_okta_api_token: ${{ secrets.OKTA_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color
