name: Terraform Okta Plan

on:
  pull_request:
    paths:
      - "okta/**"
      - ".github/workflows/terraform-okta.yml"
  push:
    branches: [main]
    paths:
      - "okta/**"

jobs:
  terraform:
    name: Terraform (Okta)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okta
    env:
      TF_VAR_okta_org_name: ${{ secrets.OKTA_ORG_NAME }}
      TF_VAR_okta_base_url: ${{ secrets.OKTA_BASE_URL }}
      TF_VAR_okta_api_token: ${{ secrets.OKTA_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
